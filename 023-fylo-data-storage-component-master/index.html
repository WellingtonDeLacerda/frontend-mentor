<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/var.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/desktop.css" media="screen and (min-width:60rem)">
  <title>Frontend Mentor | Fylo data storage component</title>
</head>
<body>
  <main>
     <section class="files box">
        <div class="logo"> 
        <img src="images/logo.svg" alt="logo do site Fylo">
        </div>
        <div class="icons">
            <div class="icon">
               <img src="images/icon-document.svg" alt="icone do documento">
            </div>
            <div class="icon">
               <img src="images/icon-folder.svg" alt="icone da pasta">
            </div>
            <div class="icon">
               <img src="images/icon-upload.svg" alt="icone do upload">
            </div>
        </div>
     </section>
     <section class="memory box">
         <p>
          You’ve used <strong>815 GB</strong> of your storage
         </p>
         <div class="back">
           
         </div>
         <div class="gigabyte">
             <strong>185</strong>
             <span>GB Left</span>
         </div>
         <div class="gb">
             <strong>0 GB</strong>
             <strong>1000 GB</strong>
         </div>
     </section>
  </main>
</body>
</html>
