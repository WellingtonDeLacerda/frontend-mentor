<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/var.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/desktop.css" media="screen and (min-width:40rem)">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Article preview component</title>
</head>
<body>
  <main>
     <section class="image">
         <img src="images/drawers.jpg" alt="imagem de uma comoda verde e um jarro dourado em cima">
     </section>
     <section class="content">
         <h1>Shift the overall look and feel by adding these wonderful 
  touches to furniture in your home</h1>
         <p>Ever been in a room and felt like something was missing? Perhaps 
  it felt slightly bare and uninviting. I’ve got some simple tips 
  to help you make any room feel complete.</p>
         
         <div class="container">
             <div class="perfil">
                 <img src="images/avatar-michelle.jpg" alt="perfil da michrlle">
                 <div class="txt">
                     <strong>Michelle Appleton</strong>
                     <span>28 Jun 2020</span>
                 </div>
             </div>
             <div class="icon">
                 <img src="images/icon-share.svg" alt="icone de compartilhar">
             </div>
         </div>
         
          <div class="container-none">
             <div class="navbar">
                 <div class="txt">
                     <span>Share</span>
                 </div>
                 <div class="icons">
                     <a href="#"><img src="images/icon-facebook.svg" alt="icone do facebook"></a>
                     <a href="#"><img src="images/icon-twitter.svg" alt="icone do twitter"></a>
                     <a href="#"><img src="images/icon-pinterest.svg" alt="icone do pinterest"></a>
                 </div>
             </div>
             <div class="icon" id="icon">
                 <img src="images/icon-share2.svg" alt="icone de compartilhar">
             </div>
         </div>
     </section>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
