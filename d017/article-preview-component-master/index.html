<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <script src="https://kit.fontawesome.com/870d21c1e1.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/var.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/desktop.css" media="(min-width:48rem)">
  <title>Frontend Mentor | Article preview component</title>
</head>
<body>
   <main>
      <section class="image">
         
      </section>
      <section class="content">
          <h1>Shift the overall look and feel by adding these wonderful 
  touches to furniture in your home</h1>
          <p>Ever been in a room and felt like something was missing? Perhaps 
  it felt slightly bare and uninviting. I’ve got some simple tips 
  to help you make any room feel complete.</p>
  
          <div class="perfil">
             <div class="dates">
                 <img src="assets/images/avatar-michelle.jpg" alt="imagem da michelle" class="avatar">
                 <div class="names">
                     <strong>Michelle Appleton</strong>
                     <span>28 Jun 2020</span>
                 </div>
             </div>
             <div class="share">
                 <img src="assets/images/icon-share1.svg" alt="icone para compartilhar" class="icon-share">
                 <div class="navbar">
               <span>Share</span>
               <div class="nav-link">
                  <a href="#" target="_blank" arial-label="Facebook"><i class="fa-brands fa-square-facebook"></i></a>
                 <a href="#" target="_blank" arial-label="Twitter"><i class="fa-brands fa-twitter"></i></a>
                 <a href="#" target="_blank" arial-label="Pinterest"><i class="fa-brands fa-pinterest"></i></a>
               </div>
             </div>
            </div>
          </div>
          
      </section>
   </main>
   <script src="js/script.js"></script>
</body>
</html>
