<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/var.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/desktop.css" media="screen and (min-width:40rem)">
  <script src="https://kit.fontawesome.com/870d21c1e1.js" crossorigin="anonymous"></script>
  <title>Frontend Mentor | Ping coming soon page</title>
</head>
<body>
    <header>
        <img src="images/logo.svg" alt="logo do site">
    </header>
    <main>
        <section class="content">
            <h1>
            We are launching <strong>soon!</strong>
            </h1>
            <p>Subscribe and get notified</p>
            <form method="post" autocomplete="on" novalidate>
                <div class="valid">
                   <input type="email" name="email" id="Iemail" placeholder="Your email address" class="input-normal">
                   <label for="Iemail" class="error label-desativado">please Provide a valid email address </label>
                </div>
                <button type="submit" class="but">Notify Me</button>
            </form>
        </section>
        <section class="image">
            <img src="images/illustration-dashboard.png" alt="imagem com ilustraçãp de um dashboard">
        </section>
    </main>
    <footer>
       <nav class="navbar">
          <ul>
             <li>
                <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
             </li>
             <li>
                 <a href="#"><i class="fa-brands fa-twitter"></i></a>
             </li>
             <li>
                 <a href="#"><i class="fa-brands fa-instagram"></i></a>
             </li>
          </ul>
       </nav>
       <p>&copy; Copyright Ping. All rights reserved.</p>
    </footer>
  <script src="js/script.js"></script>
</body>
</html>
